name: Verify experiments

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate Experiment 0
        run: |
          python scripts/run_experiment_0.py --config config/experiment_0.json --output /tmp/experiment_0_a
          python scripts/run_experiment_0.py --config config/experiment_0.json --output /tmp/experiment_0_b
      - name: Regenerate Experiment 1
        run: |
          python scripts/run_experiment_1.py --config config/experiment_1.json --output /tmp/experiment_1_a
          python scripts/run_experiment_1.py --config config/experiment_1.json --output /tmp/experiment_1_b
      - name: Regenerate Experiment 2
        run: |
          python scripts/run_experiment_2.py --config config/experiment_2.json --output /tmp/experiment_2_a
          python scripts/run_experiment_2.py --config config/experiment_2.json --output /tmp/experiment_2_b
      - name: Regenerate Experiment 3
        run: |
          python scripts/run_experiment_3.py --config config/experiment_3.json --output /tmp/experiment_3_a
          python scripts/run_experiment_3.py --config config/experiment_3.json --output /tmp/experiment_3_b
      - name: Regenerate Experiment 4
        run: |
          python scripts/run_experiment_4.py --config config/experiment_4.json --output /tmp/experiment_4_a
          python scripts/run_experiment_4.py --config config/experiment_4.json --output /tmp/experiment_4_b
      - name: Verify byte-for-byte reproducibility
        run: |
          cmp /tmp/experiment_0_a/measurements.jsonl /tmp/experiment_0_b/measurements.jsonl
          cmp /tmp/experiment_0_a/timeseries.csv /tmp/experiment_0_b/timeseries.csv
          cmp /tmp/experiment_0_a/summary.json /tmp/experiment_0_b/summary.json
          cmp /tmp/experiment_1_a/measurements.jsonl /tmp/experiment_1_b/measurements.jsonl
          cmp /tmp/experiment_1_a/timeseries.csv /tmp/experiment_1_b/timeseries.csv
          cmp /tmp/experiment_1_a/events.csv /tmp/experiment_1_b/events.csv
          cmp /tmp/experiment_1_a/summary.json /tmp/experiment_1_b/summary.json
          cmp /tmp/experiment_2_a/measurements.jsonl /tmp/experiment_2_b/measurements.jsonl
          cmp /tmp/experiment_2_a/timeseries.csv /tmp/experiment_2_b/timeseries.csv
          cmp /tmp/experiment_2_a/telemetry.csv /tmp/experiment_2_b/telemetry.csv
          cmp /tmp/experiment_2_a/summary.json /tmp/experiment_2_b/summary.json
          cmp /tmp/experiment_3_a/measurements.jsonl /tmp/experiment_3_b/measurements.jsonl
          cmp /tmp/experiment_3_a/timeseries.csv /tmp/experiment_3_b/timeseries.csv
          cmp /tmp/experiment_3_a/apartments.csv /tmp/experiment_3_b/apartments.csv
          cmp /tmp/experiment_3_a/events.csv /tmp/experiment_3_b/events.csv
          cmp /tmp/experiment_3_a/summary.json /tmp/experiment_3_b/summary.json
          cmp /tmp/experiment_4_a/measurements.jsonl /tmp/experiment_4_b/measurements.jsonl
          cmp /tmp/experiment_4_a/telemetry.csv /tmp/experiment_4_b/telemetry.csv
          cmp /tmp/experiment_4_a/water_balance.csv /tmp/experiment_4_b/water_balance.csv
          cmp /tmp/experiment_4_a/thermal_balance.csv /tmp/experiment_4_b/thermal_balance.csv
          cmp /tmp/experiment_4_a/alarms.csv /tmp/experiment_4_b/alarms.csv
          cmp /tmp/experiment_4_a/summary.json /tmp/experiment_4_b/summary.json
